# Тестовое окружение для разработки и проверки CMS:
#   web     — PHP 8.2 + Apache, сайт доступен на http://localhost:8080
#   db      — MySQL 5.7
#   mailpit — тестовый SMTP-сервер (порт 1025), веб-интерфейс писем http://localhost:8025
# Запуск: docker compose up -d --build
services:
  web:
    build: ./docker
    ports: ["8080:80"]
    volumes: [".:/var/www/html"]
    depends_on: [db, mailpit]
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cms
      MYSQL_USER: cms
      MYSQL_PASSWORD: cms
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3307:3306"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
